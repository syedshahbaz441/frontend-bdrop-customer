<main class="app-shell">
  <aside class="sidebar">
    <div class="brand-block"><span class="brand-mark">B</span><div><strong>BuddyDrop</strong><small>Customer app</small></div></div>
    <nav class="side-nav">
      @for (item of navItems; track item.route) { <a [routerLink]="item.route" class="nav-link">{{ item.label }}</a> }
    </nav>
    <div class="sidebar-card"><span>Need a quick pickup?</span><a routerLink="/book" class="secondary-btn">Order now</a></div>
  </aside>
  <div class="main-panel">
    <header class="topbar"><div class="title-group"><p class="eyebrow">Customer portal</p><h2>BuddyDrop</h2></div><div class="topbar-actions"><button class="icon-btn" aria-label="Notifications">!</button><div class="user-chip"><span class="avatar">O</span><div><strong>Olivia</strong><small>Premium</small></div></div><button class="primary-btn" routerLink="/login">Log out</button></div></header>
    <router-outlet />
  </div>
</main>
